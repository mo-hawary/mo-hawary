    <rect x="688" y="242" width="302" height="42" rx="21" fill="#111827" fill-opacity="0.74" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="839" y="269" text-anchor="middle" fill="#E5E7EB">Architecture • Cloud • Delivery</text>
